name: tapaiko_ward
description: TAPAIKO WARD — identify your ward, municipality and district in Nepal.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2
  geolocator: ^13.0.2
  intl: any
  path_provider: ^2.1.4

dev_dependencies:
  build_runner: ^2.15.1
  checks: ^0.3.1
  coverage: ^1.15.1
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mockito: ^5.7.0

flutter:
  generate: true
  uses-material-design: true
