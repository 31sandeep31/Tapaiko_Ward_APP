name: tapaiko_ward
description: Tapaiko Ward — find the ward, municipality, district and province of any place in Nepal.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.2.2
  geolocator: ^14.1.2
  intl: any
  path_provider: ^2.1.4
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2

dev_dependencies:
  build_runner: ^2.15.1
  checks: ^0.3.1
  coverage: ^1.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mockito: ^5.7.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/geo/
    - assets/data/
